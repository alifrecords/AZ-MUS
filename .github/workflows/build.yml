name: AZ MUS build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TE_COMMIT: a5e44996f5f08dfa6af5f5d02d900fb3cfa37422
  APP_VERSION: 0.15.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tracktion Engine + JUCE
        shell: bash
        run: |
          git clone https://github.com/Tracktion/tracktion_engine.git te
          cd te && git checkout $TE_COMMIT
          git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --depth 1 modules/juce
      - name: ASIO SDK (Steinberg)
        continue-on-error: true
        shell: bash
        run: |
          curl -sSL -o asio.zip https://www.steinberg.net/asiosdk
          unzip -q asio.zip -d asio_tmp && mv asio_tmp/*/ asiosdk && ls asiosdk/common | head -3
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVer=$env:APP_VERSION installer\windows\AZMUS.iss
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item installer/windows/Output/*.exe dist/
          Copy-Item "build/AZMUS_artefacts/Release/AZ MUS.exe" dist/
      - uses: actions/upload-artifact@v4
        with: { name: AZ-MUS-Windows, path: dist }

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tracktion Engine + JUCE
        run: |
          git clone https://github.com/Tracktion/tracktion_engine.git te
          cd te && git checkout $TE_COMMIT
          git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --depth 1 modules/juce
      - name: Configure (Universal)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Package
        run: |
          mkdir -p dist && cp -R "build/AZMUS_artefacts/Release/AZ MUS.app" dist/
          cp installer/macos/ORNATISH.txt dist/
          ditto -c -k --keepParent dist AZ-MUS-macOS.zip
      - uses: actions/upload-artifact@v4
        with: { name: AZ-MUS-macOS, path: AZ-MUS-macOS.zip }

  release:
    needs: [ windows, macos ]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - run: cd AZ-MUS-Windows && zip -r ../AZ-MUS-Windows.zip . && cd ..
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: AZ MUS ${{ env.APP_VERSION }}
          body: |
            AZ MUS - Digital Audio Workstation (Azimxodjayev Music)
            Windows: AZ-MUS-Windows.zip ichidagi AZ-MUS-Setup.exe ni ishga tushiring
            macOS: AZ-MUS-macOS.zip (Intel + Apple Silicon) - ORNATISH.txt ni o'qing
            Powered by Tracktion Engine
          files: |
            AZ-MUS-Windows.zip
            AZ-MUS-macOS/AZ-MUS-macOS.zip
